<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <!-- Metallic Blue Gear Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Inner Gear Depth Gradient -->
    <linearGradient id="innerRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Red Monogram Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Purple/Blue Monogram Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="gearShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#gearShadow)">
    
    <!-- 1. GEAR 1 (LEFT - 'K'): Center at (150, 160), Radius 110 -->
    <g id="Gear-K">
      <!-- Outer Gear Body with 14 Precision Teeth -->
      <path fill="url(#gearGrad)" stroke="#0284c7" stroke-width="2" d="
        M 150,50 
        L 158,51 L 163,65 L 176,69 L 187,58 L 194,62 L 193,76 L 204,84 L 217,77 L 222,83 L 215,96 L 223,107 L 237,104 L 240,111 L 229,121 L 233,133 L 247,135 L 247,143 L 233,149 L 233,161 L 247,167 L 244,175 L 230,177 L 226,189 L 238,198 L 233,205 L 219,203 L 211,214 L 219,226 L 212,232 L 200,226 L 190,235 L 193,249 L 185,253 L 176,242 L 163,248 L 160,262 L 152,263 L 146,250 L 133,252 L 126,265 L 118,264 L 117,250 L 105,248 L 95,259 L 88,256 L 93,243 L 83,235 L 69,240 L 65,233 L 75,223 L 71,211 L 57,208 L 56,200 L 69,193 L 69,181 L 55,175 L 57,167 L 71,164 L 75,152 L 64,142 L 69,136 L 83,138 L 91,127 L 83,115 L 90,109 L 102,115 L 112,106 L 109,92 L 117,88 L 126,99 L 139,94 L 142,80 Z
      " />
      <!-- Rim Outer Ring -->
      <circle cx="150" cy="160" r="76" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Inner White Center Disc -->
      <circle cx="150" cy="160" r="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Bold Precision Letter 'K' -->
      <text x="150" y="186" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="78" fill="url(#redGrad)" text-anchor="middle">K</text>
    </g>

    <!-- 2. GEAR 2 (TOP RIGHT - 'M'): Center at (335, 120), Radius 95 -->
    <g id="Gear-M">
      <!-- Outer Gear Body with 12 Precision Teeth -->
      <path fill="url(#gearGrad)" stroke="#0284c7" stroke-width="2" d="
        M 335,25
        L 343,26 L 347,38 L 359,42 L 369,32 L 375,36 L 374,48 L 384,55 L 396,49 L 400,54 L 394,66 L 401,76 L 413,73 L 416,79 L 406,88 L 409,99 L 421,101 L 421,108 L 409,113 L 409,124 L 421,129 L 418,136 L 406,138 L 402,149 L 413,157 L 408,163 L 396,161 L 389,171 L 396,181 L 390,187 L 379,181 L 370,189 L 373,201 L 366,205 L 358,195 L 347,200 L 344,212 L 337,213 L 332,202 L 321,204 L 315,215 L 308,214 L 307,202 L 297,200 L 288,210 L 282,207 L 286,196 L 277,189 L 265,193 L 261,187 L 270,178 L 266,168 L 254,165 L 253,158 L 264,152 L 264,141 L 252,136 L 254,129 L 266,126 L 270,116 L 260,107 L 264,102 L 276,104 L 283,94 L 276,84 L 282,78 L 293,83 L 302,75 L 299,63 L 306,59 L 314,69 L 325,65 L 328,53 Z
      " />
      <!-- Rim Outer Ring -->
      <circle cx="335" cy="120" r="66" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Inner White Center Disc -->
      <circle cx="335" cy="120" r="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Bold Precision Letter 'M' -->
      <text x="335" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="64" fill="url(#redGrad)" text-anchor="middle">M</text>
    </g>

    <!-- 3. GEAR 3 (BOTTOM RIGHT - 'E'): Center at (330, 290), Radius 70 -->
    <g id="Gear-E">
      <!-- Outer Gear Body with 10 Precision Teeth -->
      <path fill="url(#gearGrad)" stroke="#0284c7" stroke-width="2" d="
        M 330,220
        L 336,221 L 339,230 L 348,233 L 355,225 L 360,228 L 359,237 L 366,243 L 375,238 L 378,242 L 373,251 L 378,259 L 387,257 L 389,262 L 381,269 L 383,277 L 392,279 L 392,284 L 383,288 L 383,296 L 392,300 L 390,306 L 381,307 L 378,315 L 386,321 L 382,326 L 373,324 L 368,332 L 373,340 L 368,344 L 360,340 L 353,346 L 355,355 L 350,358 L 344,350 L 335,354 L 333,363 L 327,364 L 323,355 L 315,357 L 310,365 L 305,364 L 304,355 L 296,353 L 289,361 L 284,359 L 287,350 L 280,345 L 271,348 L 268,343 L 275,336 L 272,328 L 263,326 L 262,320 L 271,315 L 271,307 L 261,303 L 263,297 L 272,295 L 275,287 L 267,280 L 270,276 L 280,278 L 285,270 L 280,262 L 285,257 L 293,261 L 300,255 L 298,246 L 303,243 L 309,250 L 318,247 L 320,238 Z
      " />
      <!-- Rim Outer Ring -->
      <circle cx="330" cy="290" r="48" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <!-- Inner White Center Disc -->
      <circle cx="330" cy="290" r="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Bold Precision Letter 'E' -->
      <text x="330" y="306" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="46" fill="url(#purpleGrad)" text-anchor="middle">E</text>
    </g>

  </g>
</svg>
