<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <!-- High-Precision Single Color Monotone for Machine Laser Engraving & Metal Nameplates -->
  <g fill="#000000">
    <!-- Gear K -->
    <circle cx="150" cy="160" r="82" fill="none" stroke="#000000" stroke-width="12" />
    <circle cx="150" cy="160" r="54" fill="none" stroke="#000000" stroke-width="4" />
    <text x="150" y="186" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="78" fill="#000000" text-anchor="middle">K</text>
    
    <!-- Gear M -->
    <circle cx="335" cy="120" r="70" fill="none" stroke="#000000" stroke-width="10" />
    <circle cx="335" cy="120" r="46" fill="none" stroke="#000000" stroke-width="3.5" />
    <text x="335" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="64" fill="#000000" text-anchor="middle">M</text>

    <!-- Gear E -->
    <circle cx="330" cy="290" r="54" fill="none" stroke="#000000" stroke-width="8" />
    <circle cx="330" cy="290" r="34" fill="none" stroke="#000000" stroke-width="3" />
    <text x="330" y="306" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="46" fill="#000000" text-anchor="middle">E</text>
  </g>
</svg>
